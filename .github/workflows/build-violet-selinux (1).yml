# SPDX-License-Identifier: GPL-2.0-only
# Upload this ONE file to .github/workflows/build-violet-selinux.yml.
# Manual experimental build for Redmi Note 7 Pro (violet) only.
# Includes an adapted SUSFS 61fc8b78 port and BakaSU PR 648.
# Local source/host checks passed; ARM64 build and phone testing still required.
# The gzip/base64 payload below contains readable patches and checks, not binaries.
# The run extracts those files into its diagnostics artifact for review.
name: Build violet BakaSU SELinux test
run-name: Violet SELinux test - SUSFS compatibility fix v3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the reviewed builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kbyte8/KSU_Builder
          ref: 1544449d4303b023a78ac1c982721bd5c6e909bc
          path: builder
          persist-credentials: false

      - name: Checkout the reviewed XCalibur kernel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Justadeayo/android_kernel_xiaomi_violet
          ref: b215d4f33f30eda7f2fdc9ae45a8d902745df3f6
          path: kernel_src
          persist-credentials: false

      - name: Checkout the existing violet AnyKernel installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Justadeayo/AnyKernel3
          ref: master
          path: anykernel-source
          persist-credentials: false

      - name: Extract the embedded SELinux port
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          payload = json.loads(r'''{
            "kernel-selinux.patch": "",
            "bakasu-selinux.patch": "",
            "registry.c": "",
            "test-registry.py": "",
            "stage-build.py": "",
            "verify-port.py": "",
            "fetch-clang-verified.sh": "",
            "BUILD-NOTES.txt": ""
          }''')
          hashes = json.loads(r'''{
            "kernel-selinux.patch": "6ef03450894bffbe4ad537311cecabafa8776faa963b024b990b224d9b47102c",
            "bakasu-selinux.patch": "1af3e442e2a6516cb51d893fd5fadeef095dcd5ad8d5755f8d8f8c50d247fa29",
            "registry.c": "097b7f4a4b2ddab063e2961a817d63857acba3c7c5784563b7d2f33e0fd70200",
            "test-registry.py": "b7081281c9eb93e6ce5f5b5344e75f1d7d3bea965f48e02de4caa2ec32531135",
            "stage-build.py": "afc89c92ea268a64cebec68658587d63e9796a7e6bf0213d5460ed9e37bbcfe2",
            "verify-port.py": "a393caee1e6f484bd2f610407b4aba20e34bdac3ca612045e97654e17939441e",
            "fetch-clang-verified.sh": "9f4a93a7b48333fb6c42a0c35bf58746ee73ebb7d5065e9188057170a42b73b5",
            "BUILD-NOTES.txt": "0fb7fd92bec7dfff10ce61f538df3fc41fe63e63a868ec72f2ac420feea051c3"
          }''')
          destination = pathlib.Path('selinux-port')
          destination.mkdir(exist_ok=True)
          for name, encoded in payload.items():
              assert pathlib.Path(name).name == name
              data = gzip.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha256(data).hexdigest() == hashes[name], name
              (destination / name).write_bytes(data)
          pathlib.Path('diagnostics').mkdir(exist_ok=True)
          pathlib.Path('diagnostics/payload-sha256.json').write_text(json.dumps(hashes, indent=2))
          print('Embedded patches and checks extracted and verified.')
          PY

      - name: Set up swap
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c
        with:
          swap-size-gb: 10

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio flex bison libssl-dev \
            libelf-dev dwarves zip unzip curl git python3 rsync jq ccache

      - name: Validate package target and run registry regression tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          installer = Path('anykernel-source/anykernel.sh').read_text()
          if not re.search(r'^device\.name\d*=violet\s*$', installer, re.M):
              raise SystemExit('AnyKernel installer does not declare violet; stopping for review')
          if not re.search(r'^do\.devicecheck=1\s*$', installer, re.M):
              raise SystemExit('AnyKernel device checking is not enabled; stopping for review')
          print('AnyKernel declares violet and enables device checking.')
          PY
          python3 selinux-port/test-registry.py 2>&1 | tee diagnostics/registry-tests.log

      - name: Stage the builder and experimental port
        run: |
          set -euo pipefail
          cp -r builder/devices builder/scripts kernel_src/
          cp builder/config.env kernel_src/
          cd kernel_src
          python3 ../selinux-port/stage-build.py
          source scripts/common.sh
          verify_kernel_version '4.14'
          bash -n scripts/ksu.sh scripts/compile.sh scripts/env.sh scripts/fetch-clang-verified.sh
          source config.env
          bash scripts/variant.sh violet ksu 2>&1 | tee ../diagnostics/integration.log
          if grep -E 'No file to patch|Skipping patch|patch failed|No such file or directory|^sed:|^grep:.*cannot' ../diagnostics/integration.log; then
            echo '::error::Baseline integration was incomplete; see diagnostics.'
            exit 1
          fi
          test "$(git -C KernelSU rev-parse HEAD)" = 67b5645279fd07a2688d9641fd4323841efaaeb0
          git apply --check ../selinux-port/kernel-selinux.patch
          git apply ../selinux-port/kernel-selinux.patch
          git -C KernelSU apply --check ../../selinux-port/bakasu-selinux.patch
          git -C KernelSU apply ../../selinux-port/bakasu-selinux.patch
          python3 ../selinux-port/verify-port.py .

      - name: Record source versions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          repositories = {
              'builder': 'builder', 'kernel': 'kernel_src',
              'BakaSU': 'kernel_src/KernelSU',
              'SUSFS_base': 'kernel_src/.xcalibur-xf_deps/susfs',
              'AnyKernel3': 'anykernel-source',
          }
          manifest = {
              'device': 'violet', 'status': 'experimental; device untested',
              'SUSFS_change': '61fc8b78c9a0ec42fd9714134de388b1ac307a16',
              'repositories': {},
          }
          for name, path in repositories.items():
              manifest['repositories'][name] = subprocess.check_output(
                  ['git', '-C', path, 'rev-parse', 'HEAD'], text=True).strip()
          pathlib.Path('diagnostics/source-versions.json').write_text(json.dumps(manifest, indent=2)+'\n')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Restore the verified Clang toolchain
        id: clang_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: kernel_src/toolchain/clang-r596125
          key: violet-selinux-clang-r596125-verified-v2

      - name: Download and verify the Clang toolchain
        working-directory: kernel_src
        run: |
          set -euo pipefail
          mkdir -p ../diagnostics
          exec > >(tee -a ../diagnostics/toolchain-setup.log) 2>&1
          trap 'setup_rc=$?; printf "%s\n" "$setup_rc" > ../diagnostics/toolchain-exit-code.txt; exit "$setup_rc"' EXIT
          source config.env
          source scripts/env.sh violet
          clang --version > ../diagnostics/compiler-version.txt
          sha256sum toolchain/clang-r596125/bin/clang > ../diagnostics/compiler-sha256.txt
          cp toolchain/clang-r596125/.xcalibur-toolchain-complete-v2 ../diagnostics/toolchain-source.txt

      - name: Save the validated compiler for later builds
        if: steps.clang_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: kernel_src/toolchain/clang-r596125
          key: violet-selinux-clang-r596125-verified-v2

      - name: Compile the experimental violet kernel
        working-directory: kernel_src
        run: |
          set -euo pipefail
          mkdir -p ../diagnostics
          exec > >(tee -a ../diagnostics/build-session.log) 2>&1
          trap 'build_rc=$?; printf "%s\n" "$build_rc" > ../diagnostics/build-exit-code.txt; exit "$build_rc"' EXIT
          source config.env
          source scripts/env.sh violet
          bash scripts/compile.sh violet ksu
          python3 ../selinux-port/verify-port.py . --compiled
          for package in XCalibur-XF_violet_*_SELinux61fc8b7_TEST_*.zip; do
            test -f "$package"
            unzip -t "$package"
            sha256sum "$package" > "$package.sha256"
          done
          {
            echo 'Experimental violet kernel compiled and packaged.'
            echo 'This does not establish boot compatibility or detector results.'
            echo 'Download diagnostics-violet-selinux and send it for review before flashing.'
            echo 'The flashable ZIP is inside the GitHub artifact archive.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect diagnostics and the modified source files
        if: always()
        run: |
          mkdir -p diagnostics
          python3 - <<'PY'
          from pathlib import Path
          import shutil, tarfile
          output = Path('diagnostics')
          port = Path('selinux-port')
          if port.exists():
              for p in port.iterdir():
                  if p.suffix in ('.patch', '.py', '.sh', '.txt', '.c'):
                      shutil.copy2(p, output / p.name)
          root = Path('kernel_src')
          if root.exists():
              for pattern in ['*-build.log', '*-config', '*-version.txt', '*-managers.txt']:
                  for p in root.glob(pattern): shutil.copy2(p, output / p.name)
              if (root/'out/.config').is_file():
                  shutil.copy2(root/'out/.config', output/'kernel.config')
              wanted = [
                  'fs/susfs_selinux.c', 'include/linux/susfs_selinux.h',
                  'security/selinux/hooks.c', 'security/selinux/selinuxfs.c',
                  'security/selinux/ss/services.c', 'security/selinux/ss/status.c',
                  'KernelSU/kernel/selinux/sepolicy.c',
                  'KernelSU/kernel/feature/selinux_hide.c',
                  'KernelSU/kernel/supercall/dispatch.c',
                  'KernelSU/kernel/manager/pkg_observer.c',
                  'KernelSU/kernel/manager/throne_tracker.c',
                  'drivers/input/input.c', 'mm/memory.c', 'scripts/ksu.sh',
                  'scripts/compile.sh', 'scripts/env.sh', 'scripts/fetch-clang-verified.sh',
                  'config.env', 'devices/violet.json',
                  '.xcalibur-xf_deps/susfs/Patches/Patch/susfs_patch_to_4.14.patch',
                  '.xcalibur-xf_deps/susfs/Patches/susfs_inline_hook_patches.sh',
              ]
              with tarfile.open(output/'modified-sources.tar.gz', 'w:gz') as archive:
                  for name in wanted:
                      if (root/name).is_file(): archive.add(root/name, arcname=name)
                  for p in root.rglob('*.rej'):
                      if '.xcalibur-xf_deps' not in p.parts:
                          archive.add(p, arcname=str(p.relative_to(root)))
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostics-violet-selinux
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the experimental kernel package
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: xcalibur-violet-selinux-EXPERIMENTAL
          path: |
            kernel_src/XCalibur-XF_violet_*_SELinux61fc8b7_TEST_*.zip
            kernel_src/XCalibur-XF_violet_*_SELinux61fc8b7_TEST_*.zip.sha256
          if-no-files-found: error
          retention-days: 14
